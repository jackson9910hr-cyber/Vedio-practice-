# Blocks any push/PR that contains photo, video or audio files (privacy safeguard).
name: privacy-guard
on: [push, pull_request]
jobs:
  no-personal-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if media files are tracked
        run: |
          found=$(git ls-files | grep -iE '\.(jpe?g|png|gif|webp|heic|heif|bmp|tiff?|raw|dng|mp4|mov|m4v|avi|mkv|webm|wav|mp3|m4a|aac)$' || true)
          if [ -n "$found" ]; then echo "::error::Personal media must not be committed:"; echo "$found"; exit 1; fi
          echo "OK: no media files in the repository"
